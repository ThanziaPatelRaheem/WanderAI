# Define the services that make up WanderAI
services:
  # Express backend responsible for OpenAI and Supabase operations
  backend:
    # Build the backend image using server/Dockerfile
    build:
      context: ./server

    # Name the resulting Docker image
    image: wanderai-backend

    # Provide backend environment variables at runtime
    env_file:
      - ./server/.env

    # Make the backend accessible to other containers
    # without publishing port 8080 to the public host
    expose:
      - "8080"

    # Restart the backend automatically unless stopped manually
    restart: unless-stopped

  # React frontend served through Nginx
  frontend:
    # Build the frontend image using client/Dockerfile
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ""

    # Name the resulting Docker image
    image: wanderai-frontend

    # Map port 3000 on your Mac to Nginx port 80
    ports:
      - "3000:80"

    # Start the backend service before the frontend
    depends_on:
      - backend

    # Restart the frontend automatically unless stopped manually
    restart: unless-stopped
