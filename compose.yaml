# Define the services that make up WanderAI
services:
  # Express backend responsible for OpenAI and Supabase operations
  backend:
    build:
      context: ./server
    image: wanderai-backend
    env_file:
      - ./server/.env
    expose:
      - "8080"
    restart: unless-stopped

  # React frontend served through Nginx
  frontend:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ""
    image: wanderai-frontend

    # Nginx is accessible internally through Caddy
    expose:
      - "80"

    depends_on:
      - backend
    restart: unless-stopped

  # HTTPS reverse proxy with automatic SSL certificates
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend
    restart: unless-stopped

# Preserve SSL certificates and Caddy configuration
volumes:
  caddy_data:
  caddy_config:
