# ============================================================
# WanderAI - Continuous Integration (CI)
#
# Automatically tests and builds the application whenever
# code is pushed to main or a pull request targets main.
# ============================================================

name: WanderAI CI

# Trigger the workflow
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

# Permissions needed to read repository code
permissions:
  contents: read

jobs:
  # ==========================================================
  # JOB 1: Backend Unit and Integration Tests
  # ==========================================================
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      # Download repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install Node.js and enable npm dependency caching
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Install all backend dependencies, including Vitest
      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      # Run backend tests once without watch mode
      - name: Run backend tests
        working-directory: ./server
        run: npm test -- --run

  # ==========================================================
  # JOB 2: Frontend Unit Tests and Production Build
  # ==========================================================
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      # Download repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install Node.js and enable npm dependency caching
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      # Run React component and integration tests
      - name: Run frontend tests
        working-directory: ./client
        run: npm test -- --run

      # Verify Vite can produce a production build
      - name: Build React frontend
        working-directory: ./client
        run: npm run build

  # ==========================================================
  # JOB 3: Playwright End-to-End Tests
  # ==========================================================
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # Download repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      # Install Chromium and required Linux libraries
      - name: Install Playwright browser
        working-directory: ./client
        run: npx playwright install --with-deps chromium

      # Run browser-based E2E tests
      - name: Run end-to-end tests
        working-directory: ./client
        run: npx playwright test

      # Upload Playwright report if tests fail
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================
  # JOB 4: Verify Docker Images Build Successfully
  # ==========================================================
  docker-build:
    runs-on: ubuntu-latest

    # Only build Docker images after all tests pass
    needs:
      - backend-tests
      - frontend-tests
      - e2e-tests

    steps:
      # Download repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Build the Express backend Docker image
      - name: Build backend Docker image
        run: docker build -t wanderai-backend ./server

      # Build the React + Nginx frontend Docker image
      - name: Build frontend Docker image
        run: docker build -t wanderai-frontend ./client
