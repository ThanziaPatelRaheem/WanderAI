# ============================================================
# WanderAI - Continuous Deployment (CD)
#
# Deploys to AWS EC2 after WanderAI CI passes on main.
# ============================================================

name: WanderAI CD

on:
  workflow_run:
    workflows: ["WanderAI CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: wanderai-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy WanderAI over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          EC2_HOST_PUBLIC_KEY: ${{ secrets.EC2_HOST_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/wanderai-key
          chmod 600 ~/.ssh/wanderai-key

          # Fetch the SSH host key and verify it against
          # the fingerprint saved in GitHub Secrets.
          # Trust only our EC2 server's known public host key
          printf '%s %s\n' "$EC2_HOST" "$EC2_HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts


          ssh -o IdentitiesOnly=yes \
            -i ~/.ssh/wanderai-key \
            "$EC2_USER@$EC2_HOST" \
            "bash -se" -- "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail

          DEPLOY_SHA="$1"
          cd "$HOME/WanderAI"

          git fetch origin main
          git checkout --detach "$DEPLOY_SHA"

          docker compose config --quiet
          docker compose up -d --build --remove-orphans
          docker compose ps
          REMOTE
