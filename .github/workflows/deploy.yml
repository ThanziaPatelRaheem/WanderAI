# ============================================================
# WanderAI - Continuous Deployment (CD)
# Deploy to AWS EC2 through Systems Manager after CI passes.
# ============================================================

name: WanderAI CD

on:
  workflow_run:
    workflows: ["WanderAI CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: wanderai-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}

    runs-on: ubuntu-latest
    environment: production

    steps:
      # Step 1: Authenticate GitHub Actions with AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009160063400:role/WanderAI-GitHub-Deploy-Role
          aws-region: ap-southeast-1

      # Step 2: Deploy WanderAI through AWS Systems Manager
      - name: Deploy WanderAI through SSM
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          INSTANCE_ID: i-071519b8d5fe45260

        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          sha = os.environ["DEPLOY_SHA"]

          command = f"""set -eu
          sudo -u ubuntu -H bash -c '
            set -eu
            cd /home/ubuntu/WanderAI
            git fetch origin main
            git checkout --detach {sha}
            docker compose config --quiet
            docker compose up -d --build --remove-orphans
            docker compose ps
          '
          """

          with open("/tmp/ssm-parameters.json", "w") as file:
              json.dump({"commands": [command]}, file)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-parameters.json \
            --comment "Deploy WanderAI" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
